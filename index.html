<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SITCON Camp 2026 Publishing Poster</title>
		<style>
			@font-face {
				font-family: "LINE Seed TW";
				src: url("assets/fonts/LINESeedTW_OTF_Rg.woff2") format("woff2");
				font-weight: 400;
				font-style: normal;
				font-display: block;
			}

			@font-face {
				font-family: "LINE Seed TW";
				src: url("assets/fonts/LINESeedTW_OTF_Bd.woff2") format("woff2");
				font-weight: 700;
				font-style: normal;
				font-display: block;
			}

			@font-face {
				font-family: "LINE Seed TW";
				src: url("assets/fonts/LINESeedTW_OTF_Eb.woff2") format("woff2");
				font-weight: 800;
				font-style: normal;
				font-display: block;
			}

			:root {
				--background: #f9f5ef;
				--foreground: #24272e;
				--green: #b0d34b;
				--dark-green: #2d4219;
				--primary-blue: #2464ea;
				--soft-blue: #60a7d5;
				--sky-blue: #78a1f0;
				--orange: #f69977;
				--sitcon-brand: #77b55a;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: var(--background);
			}

			body {
				display: grid;
				place-items: center;
				font-family: "LINE Seed TW", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: var(--foreground);
			}

			.poster {
				position: relative;
				display: grid;
				grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.06fr);
				gap: 50px;
				width: 1920px;
				height: 1080px;
				padding: 70px 78px 70px 88px;
				overflow: hidden;
				background:
					linear-gradient(90deg, rgba(249, 245, 239, 0.96) 0%, rgba(249, 245, 239, 0.9) 47%, rgba(249, 245, 239, 0.98) 100%),
					radial-gradient(circle at 83% 13%, rgba(246, 153, 119, 0.55), transparent 34%),
					radial-gradient(circle at 11% 84%, rgba(176, 211, 75, 0.3), transparent 28%),
					var(--background);
				isolation: isolate;
			}

			.poster::before {
				position: absolute;
				inset: 0;
				z-index: -2;
				background-image:
					linear-gradient(rgba(36, 39, 46, 0.055) 2px, transparent 2px),
					linear-gradient(90deg, rgba(36, 39, 46, 0.055) 2px, transparent 2px);
				background-size: 64px 64px;
				content: "";
			}

			.poster::after {
				position: absolute;
				right: -210px;
				bottom: -230px;
				z-index: -1;
				width: 790px;
				height: 790px;
				border: 48px solid rgba(96, 167, 213, 0.18);
				border-radius: 999px;
				content: "";
			}

			.left {
				display: flex;
				flex-direction: column;
				min-width: 0;
				min-height: 0;
				height: 100%;
			}

			.brand-block {
				display: flex;
				width: fit-content;
				align-items: center;
				gap: 28px;
				padding: 18px 24px 17px;
				border: 3px solid var(--foreground);
				border-radius: 8px;
				background: var(--foreground);
				box-shadow: 12px 12px 0 var(--green);
			}

			.brand-block img {
				display: block;
				width: 258px;
				height: auto;
			}

			.brand-caption {
				display: grid;
				padding-left: 26px;
				border-left: 3px solid rgba(249, 245, 239, 0.26);
				color: var(--background);
				font-size: 28px;
				font-weight: 800;
				line-height: 1.08;
				white-space: nowrap;
			}

			.hero-copy {
				display: grid;
				gap: 28px;
				max-width: 850px;
				margin-top: auto;
			}

			.kicker {
				display: flex;
				width: fit-content;
				align-items: center;
				gap: 16px;
				margin: 0;
				color: var(--primary-blue);
				font-size: 35px;
				font-weight: 800;
				line-height: 1;
			}

			.kicker::before {
				width: 86px;
				height: 20px;
				background: var(--primary-blue);
				content: "";
			}

			h1 {
				max-width: 850px;
				margin: 0;
				color: var(--foreground);
				font-size: 80px;
				font-weight: 800;
				line-height: 1;
				letter-spacing: 0;
				white-space: nowrap;
			}

			.highlight {
				display: block;
				margin-top: 10px;
				color: var(--green);
				white-space: nowrap;
			}

			.lead {
				max-width: 830px;
				margin: 0;
				font-size: 42px;
				font-weight: 800;
				line-height: 1.34;
				letter-spacing: 0;
				text-wrap: balance;
			}

			.right {
				display: grid;
				grid-template-rows: auto 1fr;
				gap: 26px;
				min-width: 0;
				min-height: 0;
			}

			.section-heading {
				display: grid;
				gap: 14px;
				padding-top: 8px;
			}

			.section-heading p,
			.section-heading h2 {
				margin: 0;
			}

			.section-heading p {
				color: var(--primary-blue);
				font-size: 28px;
				font-weight: 800;
				line-height: 1;
			}

			.section-heading h2 {
				max-width: 850px;
				font-size: 61px;
				font-weight: 800;
				line-height: 0.98;
				letter-spacing: 0;
			}

			.master-grid {
				display: grid;
				grid-template-rows: repeat(3, minmax(0, 1fr));
				gap: 22px;
				align-self: stretch;
				min-width: 0;
				min-height: 0;
				height: 100%;
				padding-right: 10px;
				padding-bottom: 10px;
			}

			.master-card {
				--accent: var(--green);
				display: grid;
				grid-template-columns: 292px minmax(0, 1fr);
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				border: 3px solid var(--foreground);
				border-radius: 8px;
				background: var(--background);
				box-shadow: 10px 10px 0 var(--foreground);
			}

			.master-card.blue {
				--accent: var(--primary-blue);
			}

			.master-card.orange {
				--accent: var(--orange);
			}

			.master-media {
				position: relative;
				min-width: 0;
				min-height: 0;
				margin: 0;
				overflow: hidden;
				border-right: 3px solid var(--foreground);
				background: var(--soft-blue);
			}

			.master-media img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: center;
				filter: saturate(0.95) contrast(1.04);
				transform: scale(1.04);
			}

			.master-media::after {
				position: absolute;
				inset: 0;
				background: linear-gradient(180deg, transparent 52%, rgba(36, 39, 46, 0.24));
				content: "";
			}

			.master-body {
				display: grid;
				align-content: center;
				gap: 16px;
				min-width: 0;
				min-height: 0;
				padding: 26px 36px;
			}

			.master-title {
				margin: 0;
				color: var(--accent);
				font-size: 68px;
				font-weight: 800;
				line-height: 0.95;
				letter-spacing: 0;
				word-break: keep-all;
			}

			.master-instructor {
				margin: 0;
				font-size: 36px;
				font-weight: 800;
				line-height: 1.12;
				color: var(--foreground);
			}

			.corner-mark {
				position: absolute;
				right: 86px;
				top: 76px;
				z-index: -1;
				display: grid;
				grid-template-columns: repeat(5, 42px);
				grid-template-rows: repeat(5, 42px);
				opacity: 0.52;
			}

			.corner-mark span {
				width: 12px;
				height: 12px;
				border-radius: 999px;
				background: var(--orange);
			}
		</style>
	</head>
	<body>
		<main class="poster" aria-label="SITCON Camp 2026 16:9 publishing poster">
			<div class="corner-mark" aria-hidden="true">
				<span></span><span></span><span></span><span></span><span></span>
				<span></span><span></span><span></span><span></span><span></span>
				<span></span><span></span><span></span><span></span><span></span>
				<span></span><span></span><span></span><span></span><span></span>
				<span></span><span></span><span></span><span></span><span></span>
			</div>

			<section class="left" aria-label="營隊介紹">
				<div class="brand-block">
					<img src="assets/brand/sitcon-camp-logo.svg" alt="SITCON Camp 2026" />
					<div class="brand-caption" aria-hidden="true">
						<span>高中生資訊營隊</span>
					</div>
				</div>

				<div class="hero-copy">
					<p class="kicker">SITCON Camp 2026</p>
					<h1>
						給對資訊有興趣，
						<span class="highlight">想探索更多可能的您</span>
					</h1>
					<p class="lead">走進資訊安全、軟體工程與人工智慧的實戰現場。</p>
				</div>
			</section>

			<section class="right" aria-label="三大主線課程">
				<header class="section-heading">
					<p>主線課程</p>
					<h2>三大實戰主題，由強者講師帶路</h2>
				</header>

				<div class="master-grid">
					<article class="master-card green">
						<figure class="master-media">
							<img src="assets/master-class-speakers/denny-huang.webp" alt="Denny 黃一晉講師照片" />
						</figure>
						<div class="master-body">
							<h3 class="master-title">軟體工程</h3>
							<p class="master-instructor">Denny 黃一晉</p>
						</div>
					</article>

					<article class="master-card blue">
						<figure class="master-media">
							<img src="assets/master-class-speakers/jasper-yu.webp" alt="Jasper 尤理衡講師照片" />
						</figure>
						<div class="master-body">
							<h3 class="master-title">資訊安全</h3>
							<p class="master-instructor">Jasper 尤理衡</p>
						</div>
					</article>

					<article class="master-card orange">
						<figure class="master-media">
							<img src="assets/master-class-speakers/ak-kuo.webp" alt="Ak 郭慕天講師照片" />
						</figure>
						<div class="master-body">
							<h3 class="master-title">人工智慧</h3>
							<p class="master-instructor">Ak 郭慕天</p>
						</div>
					</article>
				</div>
			</section>
		</main>
	</body>
</html>
